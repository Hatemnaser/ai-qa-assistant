name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oddpath_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d oddpath_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/oddpath_ci?schema=public
      VITE_API_BASE_URL: https://api.test.example

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      # Intentionally fail closed. Render deploys only after all checks pass, so
      # high/critical production dependency advisories block a release.
      - name: Audit production dependency tree
        run: npm run audit:production

      - name: Apply migrations to a clean PostgreSQL 16 database
        run: npm run db:migrate:deploy

      # `migrate deploy` only proves that committed migrations can run. This
      # additional gate also fails when their resulting database shape differs
      # from the checked-in Prisma schema or migration history is incomplete.
      - name: Verify migration history and schema parity
        run: npm run db:drift:check

      - name: Run tests and type checks
        env:
          NODE_ENV: test
        run: npm run verify

      - name: Run real PostgreSQL integration tests
        env:
          NODE_ENV: test
          ODDPATH_DB_INTEGRATION_DATABASE: oddpath_ci
          ODDPATH_DB_INTEGRATION_TESTS: "1"
        run: npm run test:integration:db

      - name: Build API
        env:
          NODE_ENV: production
        run: npm run build:api

      - name: Build web app
        env:
          NODE_ENV: production
        run: npm run build:web
