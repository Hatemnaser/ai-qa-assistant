pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    ssl_certificate /run/secrets/ingress_tls_chain;
    ssl_certificate_key /run/secrets/ingress_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server { listen 8080 default_server; server_name _; return 444; }
    server {
        listen 8080;
        server_name staging-oddpath.eluthira.com api-staging-oddpath.eluthira.com browser-staging-oddpath.eluthira.com;
        location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 404; }
    }
    server { listen 8443 ssl default_server; server_name _; return 444; }
    server {
        listen 8443 ssl;
        server_name staging-oddpath.eluthira.com api-staging-oddpath.eluthira.com browser-staging-oddpath.eluthira.com;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
        location = /healthz { default_type text/plain; return 200 'tls-edge-only\n'; }
        location / { default_type text/plain; return 503 'Oddpath staging is not activated.\n'; }
    }
}
