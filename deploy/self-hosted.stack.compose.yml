# Add to BOTH self-hosted.compose.yml and self-hosted.operations.compose.yml.
# This supplies topology/durability, not permission to enable production gates.
# Default boot is closed. The browser profile requires separately accepted
# activation; it cannot work around the API's existing production v2 guard.
services:
  api:
    ports: !reset []
    environment:
      QA_BROWSER_VAULT_KEYRING_FILE: /run/secrets/browser_vault_keyring
      QA_BROWSER_VAULT_REVOCATION_FILE: /var/lib/oddpath-vault/revocations.sqlite
    secrets: [browser_vault_keyring]
    volumes: ["vault-revocations:/var/lib/oddpath-vault"]

  gateway:
    image: "${ODDPATH_WEB_IMAGE:?Provide the reviewed web/ingress image}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        ODDPATH_NGINX_IMAGE: "${ODDPATH_NGINX_IMAGE:?Provide a reviewed Nginx image digest}"
        VITE_API_BASE_URL: "${ODDPATH_API_ORIGIN:?Provide the exact HTTPS API build origin}"
        VITE_BROWSER_VIEWER_ORIGIN: "${ODDPATH_VIEWER_ORIGIN:?Provide the exact HTTPS viewer build origin}"
        VITE_R2_ENDPOINT: "${ODDPATH_R2_ORIGIN:-}"
    restart: unless-stopped
    init: true
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:${ODDPATH_HTTPS_PORT:-8443}:8443"]
    environment:
      ODDPATH_APP_HOST: "${ODDPATH_APP_HOST:?Provide the app TLS hostname}"
      ODDPATH_API_HOST: "${ODDPATH_API_HOST:?Provide the API TLS hostname}"
      ODDPATH_VIEWER_HOST: "${ODDPATH_VIEWER_HOST:?Provide a distinct viewer TLS hostname}"
    secrets: [ingress_tls_chain, ingress_tls_key]
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m,uid=101,gid=101
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101
      # /var/run is a symlink to /run in the image: mounting it would hide secrets.
      - /tmp:rw,noexec,nosuid,size=1m,uid=101,gid=101
    networks:
      outbound: {}
      control:
        aliases: ["${ODDPATH_API_HOST}"]
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, "wget --no-check-certificate --header=Host:$$ODDPATH_APP_HOST -q -O - https://127.0.0.1:8443/healthz | grep -qx ok"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: { driver: local, options: { max-size: "1m", max-file: "2" } }

  browser-supervisor:
    extends: { file: browser-runtime.compose.yml, service: browser-supervisor }
    profiles: [browser]
    image: "${ODDPATH_SUPERVISOR_IMAGE:?Provide the current reviewed supervisor image}"
    container_name: "${ODDPATH_SUPERVISOR_CONTAINER:?Match supervisorContainer in supervisor config}"
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/control_ca
    secrets: [managed_routing_key, vault_transfer_keyring, control_ca]
    volumes:
      - browser-journal:/var/lib/oddpath
    depends_on:
      gateway: { condition: service_healthy }

  browser-reaper:
    extends: { file: browser-runtime.compose.yml, service: browser-reaper }
    profiles: [browser]
    image: "${ODDPATH_SUPERVISOR_IMAGE:?Provide the current reviewed supervisor image}"
    environment:
      NODE_EXTRA_CA_CERTS: /run/secrets/control_ca
    secrets: [managed_routing_key, vault_transfer_keyring, control_ca]
    depends_on:
      gateway: { condition: service_healthy }

  api-reaper:
    extends: { file: self-hosted.compose.yml, service: api }
    profiles: [browser]
    entrypoint: [node, apps/api/dist/scripts/browser-reaper.js]
    ports: !reset []
    environment:
      QA_BROWSER_VAULT_KEYRING_FILE: /run/secrets/browser_vault_keyring
      QA_BROWSER_VAULT_REVOCATION_FILE: /var/lib/oddpath-vault/revocations.sqlite
    secrets: [browser_vault_keyring]
    volumes: ["vault-revocations:/var/lib/oddpath-vault"]
    healthcheck: { disable: true }
    # Same vault journal/keyring and policy as API. Never receives Docker.sock.

networks:
  control: { internal: true }
volumes:
  vault-revocations:
    external: true
    name: "${ODDPATH_VAULT_VOLUME:?Provide a dedicated durable revocation volume}"
  browser-journal:
    external: true
    name: "${ODDPATH_BROWSER_JOURNAL_VOLUME:?Provide a dedicated durable runtime journal volume}"
secrets:
  browser_vault_keyring: { file: "${ODDPATH_VAULT_KEYRING_FILE:?Provide private API storage/transfer/revocation keys}" }
  supervisor_config: { file: "${ODDPATH_SUPERVISOR_CONFIG_FILE:?Provide the existing supervisor config}" }
  browser_viewer_key: { file: "${ODDPATH_VIEWER_KEY_FILE:?Provide the shared API/viewer signing key}" }
  managed_routing_key: { file: "${ODDPATH_ROUTING_KEY_FILE:?Provide the separate managed routing key}" }
  vault_transfer_keyring: { file: "${ODDPATH_TRANSFER_KEYRING_FILE:?Provide transfer keys only, never storage/revocation keys}" }
  control_ca: { file: "${ODDPATH_CONTROL_CA_FILE:?Provide the trusted control-plane CA chain}" }
  ingress_tls_chain: { file: "${ODDPATH_TLS_CHAIN_FILE:?Provide the TLS certificate chain}" }
  ingress_tls_key: { file: "${ODDPATH_TLS_KEY_FILE:?Provide the private TLS key readable by UID101}" }
