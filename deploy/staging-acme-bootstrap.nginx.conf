# Temporary HTTP01 bootstrap only. Stop/remove before starting the TLS edge.
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
    access_log off;
    server_tokens off;
    server { listen 8080 default_server; server_name _; return 444; }
    server {
        listen 8080;
        server_name staging-oddpath.eluthira.com api-staging-oddpath.eluthira.com browser-staging-oddpath.eluthira.com;
        location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 404; }
    }
}
