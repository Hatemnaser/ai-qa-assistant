# TLS preactivation only: no API, database, browser, account, secret, or source.
# Loopback by default. Public binding requires separate owner-approved ingress.
name: oddpath-staging-tls
services:
  gateway:
    image: nginx@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    container_name: oddpath-staging-tls-edge
    entrypoint: [nginx, -g, "daemon off;"]
    user: "101:101"
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${ODDPATH_TLS_BIND:-127.0.0.1}:${ODDPATH_TLS_HTTP_PORT:-80}:8080"
      - "${ODDPATH_TLS_BIND:-127.0.0.1}:${ODDPATH_TLS_HTTPS_PORT:-443}:8443"
    volumes:
      - type: bind
        source: "${ODDPATH_TLS_DIRECTORY:?Provide the managed TLS directory}"
        target: /run/secrets
        read_only: true
      - type: bind
        source: "${ODDPATH_ACME_WEBROOT:?Provide an empty challenge-only webroot}"
        target: /var/www/acme
        read_only: true
      - type: bind
        source: ./staging-edge.nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m,uid=101,gid=101
      - /var/cache/nginx:rw,noexec,nosuid,size=4m,uid=101,gid=101
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    healthcheck:
      # Container liveness only. Use tls-deploy.py health for trusted TLS health.
      test: [CMD-SHELL, "wget --no-check-certificate --header='Host: staging-oddpath.eluthira.com' -qO- https://127.0.0.1:8443/healthz | grep -qx tls-edge-only"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: { driver: local, options: { max-size: "1m", max-file: "2" } }
